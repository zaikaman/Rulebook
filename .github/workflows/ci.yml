name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gas snapshots and coverage are toolchain-sensitive; keep this in sync with contracts/.gas-snapshot.
  FOUNDRY_VERSION: v1.9.0
  NODE_VERSION: '24'

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          # Version-pinned, so reusing the downloaded toolchain is safe and skips the release fetch.
          cache: true
      - name: Format
        run: forge fmt --check
      - name: Cache Solidity build
        uses: actions/cache@v4
        with:
          path: |
            contracts/cache
            contracts/out
          key: ${{ runner.os }}-${{ runner.arch }}-solidity-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('contracts/**/*.sol', 'contracts/foundry.toml', 'contracts/foundry.lock', 'contracts/remappings.txt') }}
      - name: Build
        run: forge build
      - name: Test
        run: forge test --deny warnings
      - name: Gas snapshot
        # Fuzz tests report a mean across random inputs, so their row changes on every run.
        # They are excluded here (and in scripts/check.mjs) to keep the check meaningful.
        run: forge snapshot --check --no-match-test testFuzz
      - name: Share compiled contracts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-contracts
          path: contracts/out
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  coverage:
    # Coverage recompiles the project with instrumentation, so it runs beside the other jobs
    # instead of holding up the browser suite that needs the compiled contracts.
    name: contracts coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true
      - name: Coverage gate
        run: node ../scripts/coverage-gate.mjs

  node:
    name: node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Every later gate reads the shared package, and the build typechecks it.
      - name: Build shared package
        run: npm run build -w packages/shared
      # Three independent tracks: static gates, unit tests, and the production bundle
      # (which also typechecks the frontend). They run at once on the same install.
      - name: Gates
        run: >-
          npx concurrently --kill-others-on-fail --names static,tests,frontend
          "npm run lint && npm run format:check && npm run check:design && npm run typecheck -w backend"
          "npm run test -w packages/shared && npm run test -w backend && npm run test -w frontend"
          "npm run build -w frontend"

  browser:
    name: browser and generated artifacts
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: compiled-contracts
          path: contracts/out
      - name: Verify generated artifacts
        # Same script `npm run verify` runs locally, so both check the committed ABI module.
        run: node scripts/generate-check.mjs
      - name: Verify deployment records
        run: node scripts/deploy-workflows-v2.mjs --check --offline --allow-contract-drift
      - name: Build shared package
        run: npm run build -w packages/shared
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Browser and accessibility tests
        run: npx playwright test

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --workspaces=false --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Scan
        run: node scripts/secret-scan.mjs
